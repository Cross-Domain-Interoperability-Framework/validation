# Do the SOSO and Croissant mapping tables still describe what the converters do?
#
# These two converter pairs carry SSSOM tables that document, rather than drive,
# the conversion (SOSO does not read its tables at all; Croissant reads its own
# but much of the structural work is in code). So the table and the code can
# drift apart with nothing to report it -- a renamed property, a moved path, a
# term the converter carries that no row mentions, a subject_class filed on the
# wrong class. All of it looks exactly like the mapping simply not being there.
#
# The two checkers make that drift loud and exit non-zero on it. Both need no
# third-party packages -- the converters guard their detect_conformance import
# and the checks run with detection off -- so this job cannot go red for a
# reason unrelated to what it checks.

name: check-mappings

on:
  workflow_dispatch:
  push:
    paths:
      - "converters/soso/ConvertToSOSO.py"
      - "converters/soso/ConvertFromSOSO.py"
      - "converters/soso/check_soso_mappings.py"
      - "converters/soso/examples/**"
      - "converters/croissant/ConvertToCroissant.py"
      - "converters/croissant/ConvertFromCroissant.py"
      - "converters/croissant/check_croissant_mappings.py"
      - "converters/croissant/croissantExamples/**"
      - "converters/croissant/MLCroissantExamples/**"
      - "converters/sssom_engine.py"
      - "converters/mappings/*.sssom.tsv"
      - ".github/workflows/check-mappings.yml"
  pull_request:
    paths:
      - "converters/soso/ConvertToSOSO.py"
      - "converters/soso/ConvertFromSOSO.py"
      - "converters/soso/check_soso_mappings.py"
      - "converters/soso/examples/**"
      - "converters/croissant/ConvertToCroissant.py"
      - "converters/croissant/ConvertFromCroissant.py"
      - "converters/croissant/check_croissant_mappings.py"
      - "converters/croissant/croissantExamples/**"
      - "converters/croissant/MLCroissantExamples/**"
      - "converters/sssom_engine.py"
      - "converters/mappings/*.sssom.tsv"
      - ".github/workflows/check-mappings.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check SOSO mapping tables against the converters
        run: python converters/soso/check_soso_mappings.py

      - name: Check Croissant mapping tables against the converters
        run: python converters/croissant/check_croissant_mappings.py
