mapping_set_id: https://w3id.org/cdif/mappings/croissant-aliases
mapping_set_title: Croissant source-IRI aliases
mapping_set_description: |
  Property IRIs a Croissant record uses that are not the IRI CDIF uses for the
  same term. ConvertFromCroissant.py rewrites a source key through this table
  before applying croissant-to-cdif.sssom.tsv, so the mapping table only ever
  names one spelling of a property.
license: https://creativecommons.org/publicdomain/zero/1.0/
mapping_provider: https://cross-domain-interoperability-framework.github.io/
mapping_tool: converters/croissant/ConvertFromCroissant.py
mapping_date: 2026-09-04
subject_source: http://mlcommons.org/croissant/1.1
object_source: https://w3id.org/cdif/data_description/1.1
curie_map:
  cr: http://mlcommons.org/croissant/
  rai: http://mlcommons.org/croissant/RAI/
  sc: https://schema.org/
  schema: http://schema.org/
  dct: http://purl.org/dc/terms/
  dcterms: http://purl.org/dc/terms/
  semapv: https://w3id.org/semapv/vocab/
  skos: http://www.w3.org/2004/02/skos/core#
comment: |
  This table normalises SPELLING before the mapping table is consulted. It
  does not translate namespaces -- that is the mapping table's job, in its
  object_id.

  Croissant's context sets

      "@vocab": "https://schema.org/"

  so a Croissant record's schema.org terms are https:// IRIs, and
  croissant-to-cdif.sssom.tsv keys on exactly that (sc:name -> schema:name,
  where schema: is http://schema.org/). CDIF binds schema: to
  http://schema.org/, which is what schema.org's own context document defines
  and therefore what the terms actually denote; https://schema.org/name is a
  different IRI that names nothing.

  The rows here exist for records that arrive with the OTHER spelling --
  chiefly Croissant produced from CDIF by ConvertToCroissant.py, which carries
  http:// terms through. Without them a lookup keyed on sc:name would miss and
  the property would fall through to passthrough. So the direction is
  schema:name -> sc:name: normalise onto what the mapping table asks for, then
  let the mapping table do the real translation.

  dct: and dcterms: are the same namespace under two prefixes; the Croissant
  context declares dct.
