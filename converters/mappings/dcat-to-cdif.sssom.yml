mapping_set_id: https://w3id.org/cdif/mappings/dcat-to-cdif
mapping_set_title: W3C DCAT to CDIF
mapping_set_description: |
  Property correspondences applied by dcat_to_cdif.py (DCAT JSON-LD -> CDIF
  core/discovery). This table is the authority: the converter reads it rather
  than restating it in code.

  Coverage is the union of the DCAT editor's draft (w3c.github.io/dxwg/dcat/)
  and the RDF vocabulary (w3.org/ns/dcat.ttl), which disagree -- the draft
  defines dcat:hasLastVersion, isVersionOf, next and seriesMember that the
  vocabulary lacks, and the vocabulary has dcat:resource with no property block
  in the draft. Two of the draft-only terms occur in our corpus, so neither
  source alone is sufficient. Extension properties observed in
  converters/DCAT/dcatExamplesOK are included as well, most as passthrough.
license: https://creativecommons.org/publicdomain/zero/1.0/
mapping_provider: https://cross-domain-interoperability-framework.github.io/
mapping_tool: converters/DCAT/dcat_to_cdif.py
mapping_date: 2026-09-04
subject_source: http://www.w3.org/ns/dcat#
object_source: https://w3id.org/cdif/discovery/1.1
see_also:
  # schema.org targets cross-checked against W3C DCAT 3 Appendix B (Alignment with Schema.org)
  - https://w3c.github.io/dxwg/dcat/#dcat-sdo
  - https://w3c.github.io/dxwg/dcat/rdf/dcat-schema.ttl
extension_definitions:
  - slot_name: object_json_path
    property: https://w3id.org/cdif/mappings/objectJsonPath
  - slot_name: subject_class
    property: https://w3id.org/cdif/mappings/subjectClass
  - slot_name: transform
    property: https://w3id.org/cdif/mappings/transform
curie_map:
  adms: http://www.w3.org/ns/adms#
  cnt: http://www.w3.org/2011/content#
  csvw: http://www.w3.org/ns/csvw#
  dcat: http://www.w3.org/ns/dcat#
  dcat-us: http://resources.data.gov/ontology/dcat-us#
  dcatap: http://data.europa.eu/r5r/
  dcatde: http://dcat-ap.de/def/dcatde/
  dcterms: http://purl.org/dc/terms/
  dpv: https://w3id.org/dpv#
  dqv: http://www.w3.org/ns/dqv#
  foaf: http://xmlns.com/foaf/0.1/
  healthdcat: http://healthdataportal.eu/ns/health#
  it6: http://data.europa.eu/it6/
  locn: http://www.w3.org/ns/locn#
  mdcat: https://w3id.org/mobilitydcat-ap#
  oa: http://www.w3.org/ns/oa#
  odrl: http://www.w3.org/ns/odrl/2/
  odrs: http://schema.theodi.org/odrs#
  org: http://www.w3.org/ns/org#
  pod: https://project-open-data.cio.gov/v1.1/schema#
  prov: http://www.w3.org/ns/prov#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  schema: http://schema.org/
  semapv: https://w3id.org/semapv/vocab/
  skos: http://www.w3.org/2004/02/skos/core#
  spdx: http://spdx.org/rdf/terms#
  time: http://www.w3.org/2006/time#
  vcard: http://www.w3.org/2006/vcard/ns#
  wdrs: http://www.w3.org/2007/05/powder-s#
comment: |
  subject_class disambiguates. DCAT is a graph, not a tree, and the same
  property means different things by class: dcterms:title on a dcat:Dataset is
  schema:name at the root, on a dcat:Distribution it names the distribution.
  DDI needed no such column because its dotted paths already carried position.

  transform names the shaper the converter applies. An empty value means a
  plain copy. The vocabulary:

    text            literal, language map or {"@value": ...} -> a string
    iri             node or string -> an IRI string
    idref           an IRI -> {"@id": ...}, where CDIF declares a reference
    date            -> the CDIF dateModified/datePublished pattern
    langcode        language IRI or string -> a BCP 47 subtag
    list            -> an array of strings
    bytes           -> schema:contentSize
    mediatype       media-type node or IRI -> an encodingFormat string
    describe        an extension property's prose -> a labelled line appended
                    to schema:description, which is one string and has
                    eighteen sources
    prefixedtext    -> a conditionsOfAccess entry labelled with the property
                    it came from, so seven vocabularies stay distinguishable
    theme           dcat:theme -> a schema:DefinedTerm carrying its IRI in
                    schema:identifier and marked schema:about = 'DCATtheme'.
                    A theme given only as an IRI is named from the last two
                    path segments, numbered if two reduce to the same name
    concept         skos:Concept -> schema:DefinedTerm
    agent           foaf:Agent -> schema:Person or schema:Organization
    vcard           vcard:Kind -> Person (the default) or Organization, with
                    e-mail, URL and telephone on its schema:contactPoint
    identifier      adms:Identifier -> a string, preferring a DOI; the others
                    go to schema:sameAs
    place           dcterms:Location -> schema:Place
    bbox            four DCAT-US coordinates -> a schema:Place whose GeoShape
                    box is "south west north east". A box outside the
                    coordinate range, or with north below south, is rejected
    period          dcterms:PeriodOfTime -> an ISO 8601 interval
    distribution    dcat:Distribution -> schema:DataDownload
    service         dcat:DataService -> a schema:WebAPI distribution. CDIF
                    does not describe services as resources, so a service a
                    dataset is reached through records how it is accessed;
                    a processing service is out of scope and is skipped
    checksum        spdx:Checksum -> CDIF's spdx:checksum object
    measurement     a bare quality value -> a dqv:QualityMeasurement
    attribution     prov:Attribution -> a contributor carrying its role
    contributorid   a bare contributor identifier -> a contributor with only
                    that identifier (name knowably absent)
    rightsholder    dcterms:rightsHolder agent -> a schema:contributor wrapped
                    in a schema:Role (roleName='rightsHolder')
    generatedby     prov:wasGeneratedBy -> a cdifProvActivity: PROV terms mapped
                    to schema.org, input entities into the required prov:used;
                    an activity with no usable input stays a plain prov:Activity
    rights          dcterms:rights -> a labelled conditionsOfAccess entry; an
                    odrs:RightsStatement fans its dataLicense / attributionText /
                    attributionURL out to license / creditText / relatedLink
    odrlpolicy      odrl:hasPolicy -> the policy ref to schema:publishingPrinciples,
                    and any inline permission / prohibition / obligation / action
                    copied verbatim into schema:conditionsOfAccess
    representationtechnique
                    adms:representationTechnique routes by value: an INSPIRE
                    SpatialRepresentationType URI passes through on the root
                    (geometry-model info), any other concept -> dcterms:conformsTo
    relatedlink     an IRI -> a schema:relatedLink whose schema:linkRelationship
                    is the source property, so every relation routed here
                    (dcterms:relation/references/replaces/isReferencedBy/...,
                    dcat version and series links, dcat:qualifiedRelation,
                    foaf:page, wdrs:describedby, ...) keeps its specific
                    meaning, and the target generalizes to any
                    schema:CreativeWork rather than another dcat:Dataset. This
                    deliberately supersedes the W3C DCAT->schema.org alignment
                    of dcterms:relation to schema:isRelatedTo, which cannot
                    carry the relationship semantics or a non-Dataset target
    passthrough     copied verbatim onto the record; JSON-LD is open world and
                    CDIF permits additional properties
    catalog-walk    structural: the converter descends rather than maps
    *-part          consumed by the transform of the same name on the parent

  A transform value names the shaper registered under it in dcat_to_cdif.py
  (the function _tf_<name>, in the _TRANSFORMS table); an empty value is a plain
  copy. A value that is NOT registered -- the *-part sentinels, passthrough and
  catalog-walk, or a typo -- is skipped by the table pass, so it silently does
  nothing (the source value then survives via the passthrough pass).

  object_json_path is applied, not merely documentation. A path naming one
  property under $. writes that property of the record; a deeper path writes
  inside one, and is applied after the catalog record is built because two
  rows write into schema:subjectOf. Only containers the converter can build
  unambiguously are nested into -- most CDIF containers are arrays of typed
  objects, where writing a loose property into the first member would invent
  an untyped node and attach the value to an arbitrary sibling.

  Row order is precedence. For a scalar target the first row to fill it wins,
  which is how "dcterms:identifier, else adms:identifier" is expressed with no
  conditional logic in the converter. Array targets accumulate instead.

  Structural behaviour that is not a term-to-term mapping, so has no row:
  a CDIF catalog record is ADDED, and its dcterms:conformsTo is derived from
  content by detect_conformance rather than copied from the source. Source
  property IRIs are first rewritten through dcat-aliases.sssom.tsv.
