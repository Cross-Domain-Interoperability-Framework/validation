mapping_set_id: https://w3id.org/cdif/mappings/dcat-to-cdif
mapping_set_title: W3C DCAT to CDIF
mapping_set_description: Property correspondences applied by dcat_to_cdif.py (DCAT JSON-LD -> CDIF core/discovery).
license: https://creativecommons.org/publicdomain/zero/1.0/
mapping_provider: https://cross-domain-interoperability-framework.github.io/
mapping_tool: converters/DCAT/dcat_to_cdif.py
mapping_date: 2026-08-24
subject_source: http://www.w3.org/ns/dcat#
object_source: https://w3id.org/cdif/discovery/1.1
extension_definitions:
  - slot_name: object_json_path
    property: https://w3id.org/cdif/mappings/objectJsonPath
curie_map:
  dcat: http://www.w3.org/ns/dcat#
  dcterms: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov#
  schema: http://schema.org/
  semapv: https://w3id.org/semapv/vocab/
  skos: http://www.w3.org/2004/02/skos/core#
comment: |
  Structural transforms the converter performs that are not term-to-term
  mappings (so they have no TSV row):
  - A CDIF catalog record is ADDED; dcterms:conformsTo is derived from content by detect_conformance (spatial/temporal presence upgrades core -> discovery).
  - Unmapped DCAT properties are preserved verbatim (open world).
