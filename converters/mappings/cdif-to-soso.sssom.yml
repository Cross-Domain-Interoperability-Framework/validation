mapping_set_id: https://w3id.org/cdif/mappings/cdif-to-soso
mapping_set_title: CDIF core+discovery to ESIP Science-on-Schema.org
mapping_set_description: Property correspondences applied by ConvertToSOSO.py (CDIF core+discovery -> SOSO v1.3).
license: https://creativecommons.org/publicdomain/zero/1.0/
mapping_provider: https://cross-domain-interoperability-framework.github.io/
mapping_tool: converters/soso/ConvertToSOSO.py
mapping_date: 2026-08-24
subject_source: https://w3id.org/cdif/discovery/1.1
object_source: https://science-on-schema.org/1.3/
extension_definitions:
  - slot_name: object_json_path
    property: https://w3id.org/cdif/mappings/objectJsonPath
curie_map:
  dqv: http://www.w3.org/ns/dqv#
  geosparql: http://www.opengis.net/ont/geosparql#
  schema: http://schema.org/
  semapv: https://w3id.org/semapv/vocab/
  skos: http://www.w3.org/2004/02/skos/core#
comment: |
  Structural transforms the converter performs that are not term-to-term
  mappings (so they have no TSV row):
  - schema:subjectOf catalog record (with dcterms:conformsTo) is dropped - SOSO has no metadata-conformance mechanism.
  - @context rewritten to SOSO style ({@vocab: http://schema.org/}); schema: prefixes stripped from property names and @type.
  - Warnings emitted (not mappings) for SOSO-required fields the CDIF record lacks: description, version, url, license.
