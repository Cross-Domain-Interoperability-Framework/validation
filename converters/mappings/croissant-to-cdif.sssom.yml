comment: |
  Coverage is the union of what the Croissant specification defines (38 cr:
  terms -- 27 properties and 11 classes) and every property found in
  converters/croissant/croissantExamples and MLCroissantExamples. Neither is
  sufficient alone: a spec lists terms nobody writes, and a corpus contains
  terms no spec mentions.

  subject_class disambiguates, as it does for DCAT. Croissant is a graph, and
  sc:name means one thing on the Dataset, another on a cr:FileObject, and a
  third on a cr:Field.

  transform names the shaper. Empty is a plain copy; passthrough keeps the
  property verbatim (JSON-LD is open world and CDIF permits additional
  properties); structural marks a term the converter's own builders consume
  while assembling record sets, fields and physical mappings; *-part is
  consumed by the parent's transform.

  Source IRIs are rewritten first through croissant-aliases.sssom.tsv, which
  is almost entirely one thing: Croissant's @vocab is https://schema.org/ and
  CDIF's schema: is http://schema.org/.

  Structural work the table cannot express, so it has no row:
  - A CDIF catalog record is ADDED; dcterms:conformsTo is derived from content
    by detect_conformance.
  - A cr:RecordSet is decomposed: its fields become schema:variableMeasured on
    the dataset, and each field's cr:source/cr:extract/cr:column becomes a
    cdif:hasPhysicalMapping on the distribution the record set reads from.
  - Lossy: Croissant transform pipelines beyond column extraction, inline
    example data, and nested subFields have no CDIF representation.
