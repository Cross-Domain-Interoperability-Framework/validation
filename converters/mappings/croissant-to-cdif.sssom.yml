mapping_set_id: https://w3id.org/cdif/mappings/croissant-to-cdif
mapping_set_title: MLCommons Croissant to CDIF
mapping_set_description: Property correspondences applied by ConvertFromCroissant.py (Croissant 1.0/1.1 -> CDIF DataDescription/Discovery; lossy inverse).
license: https://creativecommons.org/publicdomain/zero/1.0/
mapping_provider: https://cross-domain-interoperability-framework.github.io/
mapping_tool: converters/croissant/ConvertFromCroissant.py
mapping_date: 2026-08-24
subject_source: http://mlcommons.org/croissant/1.1
object_source: https://w3id.org/cdif/data_description/1.1
extension_definitions:
  - slot_name: object_json_path
    property: https://w3id.org/cdif/mappings/objectJsonPath
curie_map:
  cdi: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
  cdif: https://w3id.org/cdif/
  cr: http://mlcommons.org/croissant/
  sc: https://schema.org/
  schema: http://schema.org/
  semapv: https://w3id.org/semapv/vocab/
  skos: http://www.w3.org/2004/02/skos/core#
  spdx: http://spdx.org/rdf/terms#
comment: |
  Structural transforms the converter performs that are not term-to-term
  mappings (so they have no TSV row):
  - A CDIF catalog record is ADDED; dcterms:conformsTo is derived from content by detect_conformance.
  - Lossy: Croissant transform/format pipelines beyond column extraction are not represented in CDIF.
  - Field dataType (sc:Float/Integer/Date/Boolean/Text) is mapped back to the xsd: type on cdif:physicalDataType.
