mapping_set_id: https://w3id.org/cdif/mappings/soso-to-cdif
mapping_set_title: ESIP Science-on-Schema.org to CDIF core+discovery
mapping_set_description: Property correspondences applied by ConvertFromSOSO.py (SOSO -> CDIF core+discovery).
license: https://creativecommons.org/publicdomain/zero/1.0/
mapping_provider: https://cross-domain-interoperability-framework.github.io/
mapping_tool: converters/soso/ConvertFromSOSO.py
mapping_date: 2026-08-24
subject_source: https://science-on-schema.org/1.3/
object_source: https://w3id.org/cdif/discovery/1.1
extension_definitions:
  - slot_name: object_json_path
    property: https://w3id.org/cdif/mappings/objectJsonPath
curie_map:
  schema: http://schema.org/
  semapv: https://w3id.org/semapv/vocab/
  skos: http://www.w3.org/2004/02/skos/core#
comment: |
  Structural transforms the converter performs that are not term-to-term
  mappings (so they have no TSV row):
  - A CDIF catalog record is ADDED: schema:subjectOf typed schema:Dataset + dcat:CatalogRecord, schema:about -> dataset @id, and dcterms:conformsTo derived from content by detect_conformance.
  - @context rewritten to CDIF prefix declarations (schema/dcterms/dcat/prov, http://schema.org/).
  - Unrecognized bare property names are assigned to an unk: namespace.
