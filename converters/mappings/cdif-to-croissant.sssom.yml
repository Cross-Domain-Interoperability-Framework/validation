mapping_set_id: https://w3id.org/cdif/mappings/cdif-to-croissant
mapping_set_title: CDIF to MLCommons Croissant 1.1
mapping_set_description: Property correspondences applied by ConvertToCroissant.py (CDIF -> Croissant 1.1).
license: https://creativecommons.org/publicdomain/zero/1.0/
mapping_provider: https://cross-domain-interoperability-framework.github.io/
mapping_tool: converters/croissant/ConvertToCroissant.py
mapping_date: 2026-08-24
subject_source: https://w3id.org/cdif/data_description/1.1
object_source: http://mlcommons.org/croissant/1.1
extension_definitions:
  - slot_name: object_json_path
    property: https://w3id.org/cdif/mappings/objectJsonPath
curie_map:
  cdi: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
  cdif: https://w3id.org/cdif/
  cr: http://mlcommons.org/croissant/
  sc: https://schema.org/
  schema: http://schema.org/
  semapv: https://w3id.org/semapv/vocab/
  skos: http://www.w3.org/2004/02/skos/core#
  spdx: http://spdx.org/rdf/terms#
comment: |
  Structural transforms the converter performs that are not term-to-term
  mappings (so they have no TSV row):
  - CDIF-only discovery/provenance properties (prov:wasGeneratedBy, dqv:hasQualityMeasurement, schema:spatialCoverage, ...) are passed through verbatim with namespace prefixes added to @context.
  - Croissant conformsTo is set to http://mlcommons.org/croissant/1.1; the CDIF schema:subjectOf block is passed through.
  - Field dataType derives from the variable's data type: xsd:decimal/float/double -> sc:Float, xsd:integer/int/long -> sc:Integer, xsd:date/dateTime -> sc:Date, xsd:boolean -> sc:Boolean, String -> sc:Text.
