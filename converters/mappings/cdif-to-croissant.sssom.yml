comment: |
  Coverage is CDIF's own property set for the DiscoveryDataDescription
  composite -- what a record being converted can actually contain -- at the
  three levels a Croissant document has a place for: the dataset, its
  distributions, and its variables.

  This direction is **lossy, and the table says where**. 47 of the 85 rows have
  a Croissant target; the other 38 are recorded with an empty object_id and
  transform `unmapped`, because Croissant has no vocabulary for them: spatial
  and temporal coverage, provenance structure, quality measurements, units,
  value ranges, enumerated value domains, component roles, summary statistics,
  service descriptions, and every CSV dialect property except the delimiter.
  Recording them as rows rather than omitting them is the point -- a reader can
  see what a round trip through Croissant costs, instead of discovering it.

  Several mapped rows are lossy too, and say so in their comment: CDIF's
  ordered creator @list is unwrapped, a contributor joins the creators and its
  role is dropped, a keyword DefinedTerm keeps its name and loses its
  identifier, and a prose conditionsOfAccess becomes a boolean.

  subject_class disambiguates by level: schema:name is the dataset's, the
  distribution's, or the variable's depending on where it sits.

  Structural work with no row: a Croissant record set is SYNTHESISED per
  tabular distribution, because CDIF describes variables of the dataset while
  Croissant describes fields of a record set.
